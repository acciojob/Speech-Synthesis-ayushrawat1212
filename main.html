<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="voiceinator">

      <h1>The Voiceinator 5000</h1>

      <select name="voice" id="voices">
        <option value="">Select A Voice</option>
      </select>

      <label for="rate">Rate:</label>
      <input name="rate" type="range" min="0" max="3" value="1" step="0.1">

      <label for="pitch">Pitch:</label>

      <input name="pitch" type="range" min="0" max="2" step="0.1">
      <textarea name="text">Hello! I love JavaScript 👍</textarea>
      <button id="stop">Stop!</button>
      <button id="speak">Speak</button>

    </div>

<script>
  const msg = new SpeechSynthesisUtterance();
  let voices = [];
  const voicesDropdown = document.querySelector('[name="voice"]');
  const options = document.querySelectorAll('[type="range"], [name="text"]');
  const speakButton = document.querySelector('#speak');
  const stopButton = document.querySelector('#stop');

  //Your code goes here

	  //step 1
  function populateVoices() {

    voices = speechSynthesis.getVoices();

    voicesDropdown.innerHTML = "";

    if(voices.length === 0) {
        const option = document.createElement("option");

        option.textContent = "No voices available";
        option.value = "";

        voicesDropdown.appendChild(option); 
    }
    else {
        voices.forEach(function(voice, index) {

            const option = document.createElement("option");

            option.textContent = voice.name;
            option.value = index;

            voicesDropdown.appendChild(option); 
        });
    }
    
  }

  populateVoices();

  speechSynthesis.addEventListener("voiceschanged", populateVoices);


  //step 2
  const textInput = document.querySelector('[name="text"]');

    function setSpeech() {
        msg.text = textInput.value;
    }

    speakButton.addEventListener("click", function() {

        if (!textInput.value.trim()) return;

        setSpeech();
        setRate();
        setPitch();
        setVoice();

        speechSynthesis.speak(msg);
    });


    //step 3
   stopButton.addEventListener("click", function() {
    speechSynthesis.cancel();
   }); 


   //step 4 Set the Speech Rate
   const rateInput = document.querySelector('[name="rate"]');

    function setRate() {
        msg.rate = Number(rateInput.value);
    }

    rateInput.addEventListener("input", setRate);


    //step 5 Set Speech Pitch
    const pitchInput = document.querySelector('[name="pitch"]');

    function setPitch() {
        msg.pitch = Number(pitchInput.value);
    }

    pitchInput.addEventListener("input", setPitch);


    //step 6 Voice Selection
    function setVoice() {
        msg.voice = voices[voicesDropdown.value];
    }


    //step 7 Change Voice While Speaking
    voicesDropdown.addEventListener("change", function() {        
        setVoice();

        if(speechSynthesis.speaking) {
            speechSynthesis.cancel();

            setSpeech();
            setRate();
            setPitch();

            speechSynthesis.speak(msg);
        }
    });
	
</script>

</body>
</html>
